name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ""

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix crates/ui

      - name: Build frontend
        shell: pwsh
        run: npm run build --prefix crates/ui

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Check workspace
        shell: pwsh
        run: cargo check --workspace --locked

      - name: Run tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --locked -p desktop-snapshot-cli
          npm run tauri build --prefix crates/ui
