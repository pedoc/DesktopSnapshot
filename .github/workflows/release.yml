name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix crates/ui

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build CLI release binary
        shell: pwsh
        run: cargo build --release --locked -p desktop-snapshot-cli

      - name: Build Tauri release bundles
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $configPath = 'crates/ui/src-tauri/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding utf8
          npm run tauri build --prefix crates/ui

      - name: Package release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "DesktopSnapshot-$env:RELEASE_TAG-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          $archive = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/desktop-snapshot.exe' $stage
          Copy-Item (Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1).FullName $stage
          Copy-Item (Get-ChildItem 'target/release/bundle/msi/*.msi' | Select-Object -First 1).FullName $stage
          Copy-Item 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md' $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt') -Encoding ascii

          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_TAG `
            $env:ARCHIVE `
            "$env:GITHUB_WORKSPACE/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "DesktopSnapshot $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag
