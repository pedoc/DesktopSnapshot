name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix crates/ui

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build CLI release binary
        shell: pwsh
        run: cargo build --release --locked -p desktop-snapshot-cli

      - name: Build Tauri release bundles
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $configPath = 'crates/ui/src-tauri/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding utf8
          npm run tauri build --prefix crates/ui

      - name: Package release assets
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portableName = "DesktopSnapshot-$env:RELEASE_TAG-portable-windows-x64"
          $installerName = "DesktopSnapshot-$env:RELEASE_TAG-installers-windows-x64"
          $portableStage = Join-Path $env:RUNNER_TEMP $portableName
          $installerStage = Join-Path $env:RUNNER_TEMP $installerName
          $portableArchive = Join-Path $env:GITHUB_WORKSPACE "$portableName.zip"
          $installerArchive = Join-Path $env:GITHUB_WORKSPACE "$installerName.zip"

          New-Item -ItemType Directory -Force -Path $portableStage, $installerStage | Out-Null

          Copy-Item 'target/release/desktop-snapshot.exe' $portableStage
          Copy-Item 'target/release/desktop-snapshot-ui.exe' $portableStage
          Copy-Item 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md' $portableStage
          Compress-Archive -Path (Join-Path $portableStage '*') -DestinationPath $portableArchive -Force

          Copy-Item (Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1).FullName $installerStage
          Copy-Item (Get-ChildItem 'target/release/bundle/msi/*.msi' | Select-Object -First 1).FullName $installerStage
          Copy-Item 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md' $installerStage
          Compress-Archive -Path (Join-Path $installerStage '*') -DestinationPath $installerArchive -Force

          @($portableArchive, $installerArchive) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt') -Encoding ascii

          "portable_archive=$portableArchive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_archive=$installerArchive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PORTABLE_ARCHIVE: ${{ steps.package.outputs.portable_archive }}
          INSTALLER_ARCHIVE: ${{ steps.package.outputs.installer_archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_TAG `
            $env:PORTABLE_ARCHIVE `
            $env:INSTALLER_ARCHIVE `
            "$env:GITHUB_WORKSPACE/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "DesktopSnapshot $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag
